name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            config: Debug
            extra: ""
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            config: Release
            extra: "-DCMAKE_INSTALL_LIBDIR=lib64"
          - name: macos
            os: macos-latest
            cc: clang
            cxx: clang++
            config: Debug
            extra: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
          - name: windows
            os: windows-latest
            cc: cl
            cxx: cl
            config: Release
            extra: ""

    steps:
      - uses: actions/checkout@v4

      # only the submodules the core needs; pinned commits are not branch tips,
      # so no shallow clone
      - name: Submodules
        run: git submodule update --init poco muparserx libsimdpp

      # the build must never download anything
      - name: No network access in the build
        shell: bash
        run: |
          if grep -rnE 'file\s*\(\s*DOWNLOAD|FetchContent|ExternalProject' CMakeLists.txt lib apps cmake third_party; then
            echo "build scripts must not download anything"; exit 1
          fi

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          ${{ matrix.extra }}

      # keep going after the first error to report all of them in one run
      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure
