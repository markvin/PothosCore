name: CI

on:
  #a branch with a PR runs through pull_request: push runs only for the main branches
  push:
    branches: [master, pothos2]
  pull_request:

#the jobs only read the repository
permissions:
  contents: read

#a new push to a branch or a PR stops its older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            config: Debug
            extra: "-DPOTHOS_WARNINGS_AS_ERRORS=ON"
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
            config: Release
            extra: "-DCMAKE_INSTALL_LIBDIR=lib64 -DPOTHOS_WARNINGS_AS_ERRORS=ON"
          - name: macos
            # temporary Intel (x86_64) runner: macos-latest/macos-15 arm64 jobs
            # were repeatedly not acquired by a hosted runner (capacity);
            # switch back to arm64 (macos-latest) when it is available again
            os: macos-15-intel
            cc: clang
            cxx: clang++
            config: Debug
            extra: "-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3"
          - name: windows
            os: windows-latest
            cc: cl
            cxx: cl
            config: Release
            extra: ""

    steps:
      - uses: actions/checkout@v4

      # the build must never download anything
      - name: No network access in the build
        shell: bash
        run: |
          #all CMake files; tests/subproject uses FetchContent with a local SOURCE_DIR only
          files=$(git ls-files 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' '*.cmake.in' | grep -v '^tests/subproject/')
          if grep -nE 'file\s*\(\s*DOWNLOAD|FetchContent|ExternalProject' $files; then
            echo "build scripts must not download anything"; exit 1
          fi
          if grep -nE 'URL |GIT_REPOSITORY' tests/subproject/CMakeLists.txt; then
            echo "the subproject test must not download anything"; exit 1
          fi

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # the dependencies (conanfile.txt) come from Conan 2; CMake only gets
      # the toolchain file. CC/CXX select the compiler of the Conan profile.
      - name: Dependencies (Conan)
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          pipx install "conan>=2,<3"
          conan profile detect --force
          conan install . --output-folder=build/conan \
            -s build_type=${{ matrix.config }} -s compiler.cppstd=23 --build=missing \
            -c tools.cmake.cmaketoolchain:generator=Ninja

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_TOOLCHAIN_FILE=build/conan/conan_toolchain.cmake
          ${{ matrix.extra }}

      # keep going after the first error to report all of them in one run
      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        #-V: the output of every self-test (passed ones too, e.g. skipped tests)
        run: ctest --test-dir build --output-on-failure -V

  # the dependencies from the system packages, without Conan
  linux-system:
    name: linux-system (Arch packages)
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      #an init process as PID 1 reaps orphans: the daemon tests of PothosUtil
      #check that the daemon is gone, and a zombie still answers kill(pid, 0)
      options: --init
    steps:
      - name: Install the toolchain and the dependencies
        run: pacman -Syu --noconfirm base-devel cmake ninja git asio nlohmann-json xsimd

      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPOTHOS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -- -k 0

      - name: Test
        run: ctest --test-dir build --output-on-failure -V
